name: Terraform

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write # required for GitHub OIDC. This lets the job request a temporary identity token for AWS.
  contents: read  # lets the workflow checkout/read your repo.
  pull-requests: read # lets it read PR metadata. Useful for PR-triggered plans.

jobs:
  terraform-plan:
    environment: env-var
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AWS account variable
        run: |
          test -n "${{ vars.AWS_ACCOUNT_ID }}" || (echo "AWS_ACCOUNT_ID is empty" && exit 1)
          echo "AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }}"

      - name: Debug GitHub context
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::290993051279:role/github-actions-terraform-daycareScout
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan
